name: CI

on:
  push:
    branches: ['session/**', 'release/**', main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check the Folio ledger
        run: npm run check:folio
      - name: Build the Angular adapter and the showcase
        run: npm run build
