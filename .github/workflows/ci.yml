name: CI

on:
  push:
    branches: ['session/**', 'release/**', main]
  pull_request:

jobs:
  build:
    # Hosted minutes first; with ACTIONS_RUNNER_MODE=self-hosted the job moves to Mycelium's own runners.
    runs-on: ${{ vars.ACTIONS_RUNNER_MODE == 'self-hosted' && fromJSON('["self-hosted", "mycelium-macos"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check the Folio ledger
        run: npm run check:folio
      - name: Check the tokens are generated and meet WCAG 2.2 AA contrast
        run: npm run check:tokens
      - name: Every component has a complete contract
        run: npm run check:contracts
      - name: The adapter's unit tests
        run: npm test
      - name: Build the tokens, the Angular adapter and the showcase
        run: npm run build
      - name: The starter builds from the packed packages, as a stranger would
        run: npm run pack && node scripts/check-app.mjs starter
