name: Publish

# A release tag (x.y.z) on main publishes the four packages to npmjs with npm Trusted Publishing:
# GitHub's OIDC token (id-token: write) proves the run is this repository's publish.yml, so no npm
# token is stored anywhere, and npm adds provenance on its own. Each package's trusted publisher is
# set on npmjs.com (docs/publishing.md). A package that isn't on npm yet is skipped with a notice:
# npm can only trust a publisher for a package that exists, so a package's first version is published
# by hand. A version already on npm is skipped too, so a re-run is safe. Run it by hand on a tag
# (Actions → Publish → Run workflow → the tag) to publish a tag that came before its trusted publisher.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm Trusted Publishing (OIDC) and provenance

jobs:
  publish:
    # Trusted Publishing and provenance need a GitHub-hosted runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: npm 11.5.1 or later (Trusted Publishing)
        run: npm install -g npm@^11.5.1 && npm --version
      - run: npm ci
      - name: The tag is the packages' version
        run: |
          for p in packages/tokens packages/css packages/contracts packages/angular; do
            v=$(node -p "require('./$p/package.json').version")
            [ "$v" = "$GITHUB_REF_NAME" ] || { echo "$p is $v, the tag is $GITHUB_REF_NAME"; exit 1; }
          done
      - run: npm run check:tokens && npm run check:contracts && npm test
      - run: npm run build
      - name: Publish to npm
        run: |
          for p in packages/tokens packages/css packages/contracts dist/primal-angular; do
            name=$(node -p "require('./$p/package.json').name"); version=$(node -p "require('./$p/package.json').version")
            if ! npm view "$name" name >/dev/null 2>&1; then
              echo "::notice::$name isn't on npm yet: its first version is published by hand, then its trusted publisher is set (docs/publishing.md)."; continue
            fi
            if npm view "$name@$version" version >/dev/null 2>&1; then echo "$name@$version is already on npm"; continue; fi
            (cd "$p" && npm publish --access public --provenance)
          done
