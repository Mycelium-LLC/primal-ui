<div class="pr-options" role="group" aria-label="Display">
  <label>
    <span>Theme</span>
    <select [value]="prefs.theme()" (change)="setTheme($any($event.target).value)">
      <option value="system">System</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
  </label>
  <label>
    <span>Direction</span>
    <select [value]="prefs.direction()" (change)="setDirection($any($event.target).value)">
      <option value="ltr">Left to right</option>
      <option value="rtl">Right to left</option>
    </select>
  </label>
  <label class="pr-switch">
    <input
      type="checkbox"
      role="switch"
      [checked]="prefs.scrollToTop()"
      (change)="prefs.scrollToTop.set($any($event.target).checked)"
    />
    <span>Start each page at the top</span>
  </label>
</div>
