<pr-page-placeholder title="Text fields" release="0.3.0" covers="TextField and its kinds, NumberField, TextArea.">
<p><label>Text <input type="text" placeholder="Your name"></label></p>
<p><label>Email <input type="email" autocomplete="email"></label></p>
<p><label>Password <input type="password" autocomplete="current-password"></label></p>
<p><label>Phone <input type="tel" autocomplete="tel"></label></p>
<p><label>Website <input type="url"></label></p>
<p><label>Search <input type="search"></label></p>
<p><label>Number <input type="number" min="0" max="10" value="3"></label></p>
<p><label>Disabled <input type="text" value="Can't change this" disabled></label></p>
<p><label>Read-only <input type="text" value="Read only" readonly></label></p>
<p><label>Required <input type="text" required></label></p>
<p><label>Text area <textarea rows="3"></textarea></label></p>
</pr-page-placeholder>
