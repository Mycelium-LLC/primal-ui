<pr-page-placeholder title="Settings" release="0.8.0" covers="A settings area.">
<form (submit)="$event.preventDefault()" aria-label="Settings specimen">
  <h2>Notifications</h2>
  <p><label><input type="checkbox" role="switch" checked> Email me when a report is ready</label></p>
  <h2>Appearance</h2>
  <fieldset><legend>Theme</legend>
    <label><input type="radio" name="theme" checked> Follow the system</label><br>
    <label><input type="radio" name="theme"> Light</label><br>
    <label><input type="radio" name="theme"> Dark</label>
  </fieldset>
  <h2>Danger zone</h2>
  <p><button type="button">Delete Account</button></p>
</form>
</pr-page-placeholder>
